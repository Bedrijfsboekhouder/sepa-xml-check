[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sepa-xml-check"
version = "0.1.0"
description = "Lightweight checks for SEPA XML payment files (pain.008 direct debits and pain.001 credit transfers)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Bedrijfsboekhouder.com"}]
keywords = ["sepa", "pain.008", "pain.001", "direct debit", "lastschrift", "incasso", "iban", "xml", "validator"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Homepage = "https://github.com/Bedrijfsboekhouder/sepa-xml-check"
"Online SEPA validator" = "https://sepafilechecker.com"

[project.scripts]
sepa-xml-check = "sepa_xml_check:main"

[tool.setuptools]
py-modules = ["sepa_xml_check"]
